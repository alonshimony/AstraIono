<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" role="img" aria-label="Astra Iono — Feel the Frequency">
  <defs>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="12" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cyanStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdf4ff"/>
      <stop offset="0.5" stop-color="#4fdcff"/>
      <stop offset="1" stop-color="#22a9ec"/>
    </linearGradient>
    <linearGradient id="pinkSlash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d9b" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff2d9b"/>
      <stop offset="0.75" stop-color="#ff6dc6"/>
      <stop offset="1" stop-color="#ff6dc6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#neonGlow)" font-family="'Sora','Arial Narrow',Arial,sans-serif" font-weight="700">
    <!-- Wordmark: ASTRA / IONO. textLength locks the width so nothing clips,
         whatever font the browser substitutes. -->
    <g fill="none" stroke="url(#cyanStroke)" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">
      <!-- soft inner fill stroke for the double-tube neon feel -->
      <text x="500" y="288" text-anchor="middle" font-size="210" textLength="800" lengthAdjust="spacingAndGlyphs"
            stroke-width="2.4" stroke-opacity="0.9" style="text-transform:uppercase">ASTRA</text>
      <text x="500" y="288" text-anchor="middle" font-size="210" textLength="800" lengthAdjust="spacingAndGlyphs"
            style="text-transform:uppercase">ASTRA</text>

      <text x="500" y="508" text-anchor="middle" font-size="210" textLength="640" lengthAdjust="spacingAndGlyphs"
            stroke-width="2.4" stroke-opacity="0.9" style="text-transform:uppercase">IONO</text>
      <text x="500" y="508" text-anchor="middle" font-size="210" textLength="640" lengthAdjust="spacingAndGlyphs"
            style="text-transform:uppercase">IONO</text>
    </g>

    <!-- Pink diagonal energy slash -->
    <line x1="150" y1="318" x2="690" y2="288" stroke="url(#pinkSlash)" stroke-width="5" stroke-linecap="round"/>

    <!-- FEEL THE FREQUENCY plate -->
    <rect x="170" y="560" width="660" height="118" rx="24" ry="24"
          fill="none" stroke="url(#cyanStroke)" stroke-width="4.5"/>
    <text x="500" y="637" text-anchor="middle" fill="#f2fdff" stroke="none"
          font-size="60" textLength="560" lengthAdjust="spacingAndGlyphs"
          style="text-transform:uppercase">FEEL THE FREQUENCY</text>

    <!-- Flourish under the plate -->
    <g fill="none" stroke="url(#cyanStroke)" stroke-width="3.5" stroke-linecap="round">
      <path d="M500 690 C 452 690, 410 716, 332 720"/>
      <path d="M500 690 C 548 690, 590 716, 668 720"/>
      <path d="M500 684 L500 748"/>
      <path d="M484 712 L500 748 L516 712"/>
    </g>
  </g>
</svg>
