<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 150 724 690" width="724" height="690" role="img" aria-label="Astra Iono — Feel the Frequency">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="16" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="cyanStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9af0ff"/>
      <stop offset="0.5" stop-color="#3fd6ff"/>
      <stop offset="1" stop-color="#27b6f0"/>
    </linearGradient>
    <linearGradient id="pinkSlash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d9b" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#ff2d9b"/>
      <stop offset="0.8" stop-color="#ff5bc0"/>
      <stop offset="1" stop-color="#ff5bc0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#neonGlow)">
    <!-- Wordmark: ASTRA / IONO -->
    <g fill="none" stroke="url(#cyanStroke)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"
       font-family="'Sora','Segoe UI',sans-serif" font-weight="700">
      <text x="512" y="360" text-anchor="middle" font-size="240" letter-spacing="14"
            paint-order="stroke" style="text-transform:uppercase">ASTRA</text>
      <text x="512" y="560" text-anchor="middle" font-size="240" letter-spacing="40"
            paint-order="stroke" style="text-transform:uppercase">IONO</text>
    </g>

    <!-- Pink diagonal energy slash -->
    <line x1="250" y1="395" x2="690" y2="360" stroke="url(#pinkSlash)" stroke-width="6" stroke-linecap="round"/>

    <!-- FEEL THE FREQUENCY plate -->
    <rect x="200" y="612" width="624" height="118" rx="22" ry="22"
          fill="none" stroke="url(#cyanStroke)" stroke-width="5"/>
    <text x="512" y="690" text-anchor="middle" fill="#eafaff" stroke="none"
          font-family="'Sora','Segoe UI',sans-serif" font-weight="700"
          font-size="62" letter-spacing="12" style="text-transform:uppercase">FEEL THE FREQUENCY</text>

    <!-- Flourish under the plate -->
    <g fill="none" stroke="url(#cyanStroke)" stroke-width="4" stroke-linecap="round">
      <path d="M512 742 C 470 742, 430 768, 360 772"/>
      <path d="M512 742 C 554 742, 594 768, 664 772"/>
      <path d="M512 736 L512 800"/>
      <path d="M498 760 L512 800 L526 760"/>
    </g>
  </g>
</svg>
